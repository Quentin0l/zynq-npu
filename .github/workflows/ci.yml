name: CI

on:
  push:
  pull_request:

jobs:
  c:
    name: C (lexeur, GEMM de référence)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lexeur
        run: compiler/lexer/check.sh
      # Exercice en cours (S1) : il ne bloque pas la CI. Quand ref/check.sh
      # passe, enlève continue-on-error pour que la CI le protège.
      - name: GEMM de référence, en cours (AddressSanitizer, UBSan)
        continue-on-error: true
        run: ref/check.sh

  rtl:
    name: RTL (cocotb + Verilator, mutants)
    runs-on: ubuntu-24.04
    env:
      VERILATOR_VERSION: v5.052
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verilator en cache
        id: cache-verilator
        uses: actions/cache@v6
        with:
          path: ~/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-ubuntu-24.04
      - name: Construire Verilator (premier passage seulement)
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf flex bison help2man perl make g++ libfl-dev zlib1g-dev
          git clone --depth 1 --branch "$VERILATOR_VERSION" https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install
      - name: Outils
        run: |
          echo "$HOME/verilator/bin" >> "$GITHUB_PATH"
          pip install -r requirements.txt
      # Code 2 : tous les tests passent, mais un mutant survit (un test reste à écrire).
      - name: NPU v1, le moteur (bancs cocotb et mutants)
        run: |
          verilator --version
          tb/check.sh v1 || [ $? -eq 2 ]
      # La v2 est en cours : elle s'affiche dans la CI sans la bloquer.
      - name: NPU v2, le tableau 8 × 8, en cours
        continue-on-error: true
        run: tb/check.sh v2 || [ $? -eq 2 ]
